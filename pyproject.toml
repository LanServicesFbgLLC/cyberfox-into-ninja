[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberfox-into-ninja"
version = "0.1.0"
description = "Poll the CyberFOX AutoElevate Partner API (beta) and file matching tickets in NinjaOne."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
cyberfox-into-ninja = "cyberfox_into_ninja.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
