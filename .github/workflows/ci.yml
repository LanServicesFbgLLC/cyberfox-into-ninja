name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest -q

  # Single required status check: branch protection points at this job, so
  # adding/removing matrix entries never needs a settings change.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [build, test]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          [ "${{ needs.build.result }}" = "success" ] || exit 1
          [ "${{ needs.test.result }}" = "success" ] || exit 1
